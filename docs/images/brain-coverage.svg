<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><style>
    .solid{fill:#f0fdf4;stroke:#22c55e;stroke-width:2.5}
    .mid{fill:#fffbeb;stroke:#f59e0b;stroke-width:2.5}
    .weak{fill:#fef2f2;stroke:#ef4444;stroke-width:2.5;stroke-dasharray:6 4}
    .n{font-size:11px;fill:#94a3b8;font-weight:700}
    .t{font-size:14px;fill:#0f172a;font-weight:600}
    .s{font-size:11.5px;fill:#475569}
    .lbl{font-size:12px;fill:#64748b;font-style:italic}
  </style></defs>
  <rect width="1000" height="560" fill="#fafafa"/>
  <text x="34" y="36" font-size="19" font-weight="700" fill="#0f172a">Ten brain functions — what exists today</text>
  <text x="34" y="58" class="s">Strong cortex and strong hands, weak danger-detection. That is the shape Stage 1 fixes first.</text>

  <text x="40" y="92" class="n">IN</text>
  <rect class="mid" x="40" y="100" width="176" height="86" rx="10"/>
  <text x="128" y="124" class="t" text-anchor="middle">1 · Sensory</text>
  <text x="128" y="145" class="s" text-anchor="middle">doors, files, transcripts</text>
  <text x="128" y="162" class="s" text-anchor="middle">no Jira/Git/CI wired in</text>
  <text x="128" y="179" class="s" text-anchor="middle">no events, no voice</text>

  <rect class="mid" x="232" y="100" width="176" height="86" rx="10"/>
  <text x="320" y="124" class="t" text-anchor="middle">2 · Attention</text>
  <text x="320" y="145" class="s" text-anchor="middle">KB search, cited</text>
  <text x="320" y="162" class="s" text-anchor="middle">snippets in the brief</text>
  <text x="320" y="179" class="s" text-anchor="middle">reads skip the privacy wall</text>

  <text x="424" y="92" class="n">HOLD &amp; STORE</text>
  <rect class="mid" x="424" y="100" width="176" height="86" rx="10"/>
  <text x="512" y="124" class="t" text-anchor="middle">3 · Working memory</text>
  <text x="512" y="145" class="s" text-anchor="middle">context window + SQLite</text>
  <text x="512" y="162" class="s" text-anchor="middle">no queue, no resume</text>
  <text x="512" y="179" class="s" text-anchor="middle">status/updates are stubs</text>

  <rect class="mid" x="616" y="100" width="176" height="86" rx="10"/>
  <text x="704" y="124" class="t" text-anchor="middle">4 · Hippocampus</text>
  <text x="704" y="145" class="s" text-anchor="middle">ingest, extract, harvest</text>
  <text x="704" y="162" class="s" text-anchor="middle">redaction gate</text>
  <text x="704" y="179" class="s" text-anchor="middle">extraction dead on example-kb</text>

  <rect class="solid" x="808" y="100" width="152" height="86" rx="10"/>
  <text x="884" y="124" class="t" text-anchor="middle">5 · Cortex</text>
  <text x="884" y="145" class="s" text-anchor="middle">KB graph + RAG</text>
  <text x="884" y="162" class="s" text-anchor="middle">4 brains, layers</text>
  <text x="884" y="179" class="s" text-anchor="middle">strongest piece</text>

  <text x="40" y="232" class="n">DECIDE</text>
  <rect class="weak" x="40" y="240" width="270" height="94" rx="10"/>
  <text x="175" y="266" class="t" text-anchor="middle">6 · Prefrontal — thin BY DESIGN</text>
  <text x="175" y="288" class="s" text-anchor="middle">one router call picks kind, brain, hand, steps</text>
  <text x="175" y="306" class="s" text-anchor="middle">the hands do the thinking, not Ethan</text>
  <text x="175" y="324" class="s" text-anchor="middle">missing on purpose: a 2nd model critiques the plan</text>

  <rect class="weak" x="326" y="240" width="300" height="94" rx="10"/>
  <text x="476" y="266" class="t" text-anchor="middle">7 · Amygdala — THE REAL GAP</text>
  <text x="476" y="288" class="s" text-anchor="middle">has: redaction gate, write-side door classes, 3 allowlists</text>
  <text x="476" y="306" class="s" text-anchor="middle">missing: approval gate, secret scrub, push block,</text>
  <text x="476" y="324" class="s" text-anchor="middle">per-hand isolation, console auth, read-side wall</text>

  <rect class="solid" x="642" y="240" width="318" height="94" rx="10"/>
  <text x="801" y="266" class="t" text-anchor="middle">8 · Basal ganglia — habits</text>
  <text x="801" y="288" class="s" text-anchor="middle">10 skills, agents, templates, routing hints</text>
  <text x="801" y="306" class="s" text-anchor="middle">Skill ontology exists; the graph is empty today</text>
  <text x="801" y="324" class="s" text-anchor="middle">Codex and Kimi do not get the skills yet</text>

  <text x="40" y="382" class="n">ACT</text>
  <rect class="mid" x="40" y="390" width="440" height="94" rx="10"/>
  <text x="260" y="416" class="t" text-anchor="middle">9 · Cerebellum — execute and correct</text>
  <text x="260" y="438" class="s" text-anchor="middle">watchdogs, process-group kill, run logs, validator, gates</text>
  <text x="260" y="456" class="s" text-anchor="middle">no retries, no structured result from a hand</text>
  <text x="260" y="474" class="s" text-anchor="middle">a hand saying "I pushed" is self-reported, never checked</text>

  <rect class="solid" x="496" y="390" width="464" height="94" rx="10"/>
  <text x="728" y="416" class="t" text-anchor="middle">10 · Motor — strong, and today unguarded</text>
  <text x="728" y="438" class="s" text-anchor="middle">3 hands · 312 KB tools · Jira, az, GitLab under your own identity</text>
  <text x="728" y="456" class="s" text-anchor="middle">can push, write Jira, ingest cross-tenant — nothing stops it</text>
  <text x="728" y="474" class="s" text-anchor="middle">no browser, no vision yet</text>

  <rect class="solid" x="40" y="516" width="14" height="14" rx="3"/><text x="62" y="528" class="lbl">solid — 3 of 10</text>
  <rect class="mid" x="190" y="516" width="14" height="14" rx="3"/><text x="212" y="528" class="lbl">there but thin or fragile — 5 of 10</text>
  <rect class="weak" x="470" y="516" width="14" height="14" rx="3"/><text x="492" y="528" class="lbl">nearly missing — 2 of 10 (one of them deliberate)</text>
</svg>
