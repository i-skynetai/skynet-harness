<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#64748b"/>
    </marker>
    <style>
      .eth{fill:#f0f9ff;stroke:#0ea5e9;stroke-width:2.5}
      .har{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.5}
      .kb{fill:#eef2ff;stroke:#6366f1;stroke-width:2.5}
      .kb{fill:#f8fafc;stroke:#94a3b8;stroke-width:2.5}
      .hand{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}
      .inner{fill:#fff;stroke:#cbd5e1;stroke-width:1.6}
      .t{font-size:14px;fill:#0f172a;font-weight:700}
      .s{font-size:10.5px;fill:#475569}
      .tag{font-size:10.5px;fill:#64748b;font-weight:700}
      .ln{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1040" height="720" fill="#fafafa"/>
  <text x="34" y="36" font-size="19" font-weight="700" fill="#0f172a">SKY — the whole solution</text>
  <text x="34" y="58" class="s">Each layer is useful without the one above it. Together with the coding agent they form one brain.</text>

  <!-- ETHAN -->
  <rect class="eth" x="34" y="80" width="700" height="118" rx="11"/>
  <text x="56" y="108" class="t">Ethan — the senses and the planner</text>
  <text x="722" y="108" class="tag" text-anchor="end">WAVE 2 · optional · one per person</text>
  <rect class="inner" x="56" y="122" width="158" height="58" rx="8"/>
  <text x="135" y="143" class="s" text-anchor="middle" font-weight="700">Doors</text>
  <text x="135" y="160" class="s" text-anchor="middle">phone · console</text>
  <text x="135" y="174" class="s" text-anchor="middle">CLI · schedule</text>
  <rect class="inner" x="228" y="122" width="158" height="58" rx="8"/>
  <text x="307" y="143" class="s" text-anchor="middle" font-weight="700">Router</text>
  <text x="307" y="160" class="s" text-anchor="middle">picks the KB</text>
  <text x="307" y="174" class="s" text-anchor="middle">picks the hand</text>
  <rect class="inner" x="400" y="122" width="158" height="58" rx="8"/>
  <text x="479" y="143" class="s" text-anchor="middle" font-weight="700">Launcher</text>
  <text x="479" y="160" class="s" text-anchor="middle">scrubbed env</text>
  <text x="479" y="174" class="s" text-anchor="middle">two watchdogs</text>
  <rect class="inner" x="572" y="122" width="150" height="58" rx="8"/>
  <text x="647" y="143" class="s" text-anchor="middle" font-weight="700">Close-out</text>
  <text x="647" y="160" class="s" text-anchor="middle">keeps what is</text>
  <text x="647" y="174" class="s" text-anchor="middle">worth keeping</text>

  <path class="ln" d="M384,198 L384,228"/>
  <text x="398" y="218" class="s">drives — never a second implementation</text>

  <!-- HARNESS -->
  <rect class="har" x="34" y="230" width="700" height="150" rx="11"/>
  <text x="56" y="258" class="t">Skynet Harness — the habits and the conscience</text>
  <text x="722" y="258" class="tag" text-anchor="end">WAVE 1 · everyone installs it</text>
  <rect class="inner" x="56" y="272" width="158" height="90" rx="8"/>
  <text x="135" y="293" class="s" text-anchor="middle" font-weight="700">Skills</text>
  <text x="135" y="310" class="s" text-anchor="middle">context · design</text>
  <text x="135" y="324" class="s" text-anchor="middle">spec · bugfix · impact</text>
  <text x="135" y="338" class="s" text-anchor="middle">analyze · test · review</text>
  <text x="135" y="352" class="s" text-anchor="middle">ingest · learn</text>
  <rect class="inner" x="228" y="272" width="158" height="90" rx="8"/>
  <text x="307" y="293" class="s" text-anchor="middle" font-weight="700">Role agents</text>
  <text x="307" y="312" class="s" text-anchor="middle">Developer</text>
  <text x="307" y="326" class="s" text-anchor="middle">Reviewer</text>
  <text x="307" y="340" class="s" text-anchor="middle">Architect</text>
  <text x="307" y="354" class="s" text-anchor="middle">Security</text>
  <rect class="inner" x="400" y="272" width="158" height="90" rx="8"/>
  <text x="479" y="293" class="s" text-anchor="middle" font-weight="700">Policy</text>
  <text x="479" y="312" class="s" text-anchor="middle">tool allowlists</text>
  <text x="479" y="326" class="s" text-anchor="middle">guard hook</text>
  <text x="479" y="340" class="s" text-anchor="middle">secret scan</text>
  <text x="479" y="354" class="s" text-anchor="middle">ship renderer</text>
  <rect class="inner" x="572" y="272" width="150" height="90" rx="8"/>
  <text x="647" y="293" class="s" text-anchor="middle" font-weight="700">Identity</text>
  <text x="647" y="312" class="s" text-anchor="middle">person · agent</text>
  <text x="647" y="326" class="s" text-anchor="middle">role · task</text>
  <text x="647" y="340" class="s" text-anchor="middle">stamped on every</text>
  <text x="647" y="354" class="s" text-anchor="middle">write and commit</text>

  <path class="ln" d="M384,380 L384,410"/>
  <text x="398" y="400" class="s">reads and writes — layer project only</text>

  <!-- KB -->
  <rect class="kb" x="34" y="412" width="700" height="98" rx="11"/>
  <text x="56" y="440" class="t">SKY_KB — the team's knowledge</text>
  <text x="722" y="440" class="tag" text-anchor="end">WAVE 1 · one KB tenant</text>
  <text x="56" y="464" class="s">designs · specs · module cards · fix notes · delivery history · learnings</text>
  <text x="56" y="484" class="s">Context and memory only — never a queue, a lock, a permission system, or live status.</text>
  <text x="56" y="502" class="s" font-style="italic">Other KBs sit beside it: a client KB, a personal KB. One entry each in kb-map.json.</text>

  <path class="ln" d="M384,510 L384,540"/>

  <rect class="kb" x="34" y="542" width="700" height="62" rx="11"/>
  <text x="56" y="568" class="t">KB — graph, vectors, documents, search, ingest</text>
  <text x="56" y="590" class="s">already running · one account and one token per person, so an ingest can be attributed</text>

  <!-- HAND column -->
  <rect class="hand" x="756" y="80" width="250" height="430" rx="11"/>
  <text x="881" y="108" class="t" text-anchor="middle">The hand</text>
  <text x="881" y="128" class="s" text-anchor="middle">Claude · Codex · Kimi</text>
  <text x="881" y="150" class="s" text-anchor="middle" font-style="italic">chosen by the user, or by Ethan</text>
  <rect class="inner" x="778" y="166" width="206" height="46" rx="8"/>
  <text x="881" y="185" class="s" text-anchor="middle" font-weight="700">Reasoning model</text>
  <text x="881" y="202" class="s" text-anchor="middle">its own LLM</text>
  <rect class="inner" x="778" y="222" width="206" height="46" rx="8"/>
  <text x="881" y="241" class="s" text-anchor="middle" font-weight="700">Working memory</text>
  <text x="881" y="258" class="s" text-anchor="middle">context window, session</text>
  <rect class="inner" x="778" y="278" width="206" height="60" rx="8"/>
  <text x="881" y="297" class="s" text-anchor="middle" font-weight="700">Tools</text>
  <text x="881" y="314" class="s" text-anchor="middle">shell · edit · browser</text>
  <text x="881" y="330" class="s" text-anchor="middle">+ the user's MCP servers</text>
  <rect class="inner" x="778" y="348" width="206" height="46" rx="8"/>
  <text x="881" y="367" class="s" text-anchor="middle" font-weight="700">Execution loop</text>
  <text x="881" y="384" class="s" text-anchor="middle">run, check, correct</text>
  <text x="881" y="424" class="s" text-anchor="middle">The harness loads into it.</text>
  <text x="881" y="442" class="s" text-anchor="middle">It supplies what the harness</text>
  <text x="881" y="458" class="s" text-anchor="middle">and the KB cannot: the thinking</text>
  <text x="881" y="474" class="s" text-anchor="middle">and the acting.</text>

  <!-- brain band -->
  <rect x="34" y="624" width="972" height="66" rx="11" fill="#fff" stroke="#0f172a" stroke-width="2.5"/>
  <text x="520" y="650" class="t" text-anchor="middle">All of it together, for one task, is the brain</text>
  <text x="520" y="672" class="s" text-anchor="middle">KB + model + working memory + skills + policy + tools. It can be partly assembled, so it has a status — and a brain with no policy may answer and review, never build.</text>
</svg>
