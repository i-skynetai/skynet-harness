<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      .bx{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .eth{fill:#f0fdf4;stroke:#86efac;stroke-width:2}
      .hand{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}
      .hum{fill:#fffbeb;stroke:#fcd34d;stroke-width:2}
      .kb{fill:#eef2ff;stroke:#a5b4fc;stroke-width:2}
      .t{font-size:15px;fill:#0f172a;font-weight:600}
      .s{font-size:12.5px;fill:#475569}
      .m{font-size:11.5px;fill:#334155;font-family:Menlo,Consolas,monospace}
      .lbl{font-size:12px;fill:#64748b;font-style:italic}
      .ln{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1000" height="610" fill="#fafafa"/>
  <text x="34" y="38" font-size="19" font-weight="700" fill="#0f172a">How Ethan runs one hand</text>
  <text x="34" y="60" class="s">The hand reaches exactly one KB and is given no supported write tool. Every outward write leaves as an intent for the broker.</text>

  <rect class="eth" x="40" y="90" width="270" height="92" rx="10"/>
  <text x="175" y="116" class="t" text-anchor="middle">1 · Ethan picks KB B</text>
  <text x="175" y="137" class="s" text-anchor="middle">hint → repo path → default · never the first entry</text>
  <text x="175" y="155" class="s" text-anchor="middle">cwd must be under a KB's repos</text>
  <text x="175" y="172" class="s" text-anchor="middle">repo hooks/mcp config hashed; change → ask first</text>

  <rect class="hand" x="365" y="90" width="595" height="196" rx="10"/>
  <text x="662" y="116" class="t" text-anchor="middle">2 · spawn the hand with an engineered environment</text>
  <text x="385" y="140" class="m">env = only  PATH HOME LANG TERM  +  SKY_KB_URL SKY_KB_PAT SKY_KB_NAME SKY_AGENT SKY_TASK</text>
  <text x="385" y="159" class="m">claude -p --strict-mcp-config --mcp-config B-only.json</text>
  <text x="385" y="176" class="m">          --agent sky:&lt;role&gt;  --allowedTools &lt;local + KB-read list&gt;</text>
  <text x="385" y="197" class="m">GIT_CONFIG_NOSYSTEM=1  GIT_CONFIG_GLOBAL=&lt;no helper&gt;  GIT_ASKPASS=/usr/bin/false</text>
  <text x="385" y="214" class="m">GIT_SSH_COMMAND='ssh -o BatchMode=yes -o IdentitiesOnly=yes -i /nonexistent'</text>
  <text x="385" y="240" class="s">→ tool list = B's kb + built-ins only · normal push paths fail · doctor proves it by dry-run first</text>
  <text x="385" y="262" class="lbl">codex: exec --ignore-user-config -c mcp_servers.kb.url=… (to verify) · kimi: review only, never build</text>
  <path class="ln" d="M310,136 L363,136"/>

  <rect class="hand" x="365" y="318" width="280" height="86" rx="10"/>
  <text x="505" y="344" class="t" text-anchor="middle">3 · hand does the work</text>
  <text x="505" y="365" class="s" text-anchor="middle">/sky:* skills against B · edits · local commits</text>
  <text x="505" y="383" class="s" text-anchor="middle">trailer: SKY-Agent + agent id + run id</text>
  <path class="ln" d="M505,286 L505,316"/>

  <rect class="hand" x="680" y="318" width="280" height="86" rx="10"/>
  <text x="820" y="344" class="t" text-anchor="middle">4 · outward writes become intents</text>
  <text x="820" y="365" class="m" text-anchor="middle">.sky/pending/&lt;id&gt;.json</text>
  <text x="820" y="383" class="s" text-anchor="middle">{kind: push | pr_open | jira_transition …}</text>
  <path class="ln" d="M645,361 L678,361"/>

  <rect class="eth" x="40" y="440" width="330" height="86" rx="10"/>
  <text x="205" y="466" class="t" text-anchor="middle">5 · core's broker validates it</text>
  <text x="205" y="487" class="s" text-anchor="middle">grant · scope · expected head · already done?</text>
  <text x="205" y="505" class="s" text-anchor="middle">broker holds the git/ticket credentials</text>
  <path class="ln" d="M820,404 L820,422 L205,422 L205,438"/>

  <rect class="hum" x="400" y="440" width="270" height="86" rx="10"/>
  <text x="535" y="466" class="t" text-anchor="middle">6 · rendered for a person to run</text>
  <text x="535" y="487" class="m" text-anchor="middle">git push · az repos pr create</text>
  <text x="535" y="505" class="s" text-anchor="middle">broker-executed only after H11</text>
  <path class="ln" d="M370,483 L398,483"/>

  <rect class="kb" x="700" y="440" width="260" height="86" rx="10"/>
  <text x="830" y="466" class="t" text-anchor="middle">7 · harvest into B</text>
  <text x="830" y="487" class="s" text-anchor="middle">async ingest · layer project · stamped</text>
  <text x="830" y="505" class="s" text-anchor="middle">sky_person · sky_agent · sky_role · sky_kb</text>
  <path class="ln" d="M670,483 L698,483"/>

  <text x="40" y="566" class="lbl">Identity: the platform records the token owner. Core stamps what core creates — reliable correlation for those, not for everything.</text>
  <text x="40" y="586" class="lbl">Interactive sessions are different: there the boundary is the role allowlist plus the host's own permission prompt.</text>
</svg>
