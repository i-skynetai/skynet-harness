<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
<rect width="960" height="330" fill="#f8fafc"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>
<g font-family="-apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">
<text x="480" y="36" font-size="20" font-weight="700" fill="#0f172a">One run, under one policy</text>
<text x="480" y="60" font-size="13" fill="#475569">The harness sits between you and the coding agent you already use.</text>
<g font-size="15" font-weight="600" fill="#0f172a">
<rect x="30" y="95" width="150" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="105" y="125">Task</text><text x="105" y="146" font-size="12" font-weight="400" fill="#475569">a ticket or a sentence</text>
<rect x="215" y="95" width="160" height="70" rx="10" fill="#eff6ff" stroke="#38bdf8" stroke-width="2"/>
<text x="295" y="125">Knowledge base</text><text x="295" y="146" font-size="12" font-weight="400" fill="#475569">one per run, you choose</text>
<rect x="410" y="95" width="160" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
<text x="490" y="125">Role policy</text><text x="490" y="146" font-size="12" font-weight="400" fill="#475569">default deny</text>
<rect x="605" y="95" width="150" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
<text x="680" y="125">Coding agent</text><text x="680" y="146" font-size="12" font-weight="400" fill="#475569">Claude Code, Codex, Kimi</text>
<rect x="790" y="95" width="140" height="70" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="860" y="125">Run record</text><text x="860" y="146" font-size="12" font-weight="400" fill="#475569">local, not the model's</text>
<rect x="395" y="235" width="190" height="70" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
<text x="490" y="265">You decide</text><text x="490" y="286" font-size="12" font-weight="400" fill="#475569">push, pull request, ticket</text>
</g>
<g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="180" y1="130" x2="212" y2="130"/><line x1="375" y1="130" x2="407" y2="130"/>
<line x1="570" y1="130" x2="602" y2="130"/><line x1="755" y1="130" x2="787" y2="130"/>
<line x1="490" y1="165" x2="490" y2="232"/>
</g>
<text x="500" y="205" font-size="12" fill="#475569" text-anchor="start">anything that leaves the machine</text>
</g>
</svg>
