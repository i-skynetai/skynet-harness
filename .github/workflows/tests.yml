name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suite is standard library only, so this is the whole build: no
    # install step, no lockfile, nothing to drift. If a version of Python
    # the README claims support for stops working, this is where it shows.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover -s core/tests -t core -v
      - name: Check the repository against itself
        # Fails if the plugin's vendored runtime drifts from core/, if a role's
        # tool list stops matching the policy, or if a credential lands in the plugin.
        run: ./core/bin/sky selftest
