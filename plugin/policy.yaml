# Skills declare tools; roles grant skills. Procedure alignment is SH-082.
skills:
  discover:
    tools: ["Read", "Grep", "Glob", "+kb_read", "+code_read"]
  analyze:
    tools: ["Read", "Grep", "Glob", "+kb_read", "+code_read"]
  plan:
    tools: ["Read", "Grep", "Glob", "+kb_read"]
  decide:
    tools: ["Read", "Grep", "Glob", "+kb_read"]
  adr:
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "+kb_read", "+code_read"]
  module:
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "+kb_read", "+code_read"]
  ask:
    tools: ["Read", "Grep", "Glob", "+kb_read"]
  bugfix:
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "Bash(git add:*)", "Bash(git commit:*)", "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(npm test:*)", "Bash(pytest:*)", "Bash(make test:*)", "+kb_read", "+code_read"]
  build:
    tools: []
  code:
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "Bash(git add:*)", "Bash(git commit:*)", "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)"]
  context:
    tools: ["Read", "Grep", "Glob", "+kb_read", "+code_read"]
  design:
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "+kb_read", "+code_read"]
  doctor:
    tools: []
  impact:
    tools: ["Read", "Grep", "Glob", "mcp__kb__kb_similarity_search", "mcp__kb__kb_graph_query", "mcp__kb__kb_ontologies_get"]
  ingest:
    tools: ["Read", "+kb_read"]
  learn:
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "Bash(git add:*)", "Bash(git commit:*)", "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "+kb_read"]
  review:
    tools: ["Read", "Grep", "Glob", "+kb_read", "+code_read"]
  secure:
    tools: ["Read", "Grep", "Glob", "+kb_read", "+code_read"]
  setup:
    tools: []
  ship:
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)"]
  skills:
    tools: ["Read", "Grep", "Glob", "+catalogue_read"]
  spec:
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "Bash(git add:*)", "Bash(git commit:*)", "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)", "Bash(npm test:*)", "Bash(pytest:*)", "Bash(make test:*)", "+kb_read", "+code_read"]
  sync:
    tools: ["Read", "Edit", "Write", "Grep", "Glob", "+catalogue_read"]
  test:
    tools: ["Read", "Grep", "Glob", "Bash(npm test:*)", "Bash(pytest:*)", "Bash(make test:*)"]

roles:
  developer:
    purpose: "implement a bounded change, with tests, and stop"
    base_tools: ["Read", "Edit", "Write", "Grep", "Glob"]
    skills: ["code", "test", "context", "skills", "ask", "bugfix", "review", "secure", "ship", "decide", "analyze"]
    may: ["repo.read", "repo.edit", "test.run", "commit.local", "code.index.read", "kb.read", "ticket.read", "pr.read", "ci.read"]
    needs_human: ["push", "pr.open", "ticket.comment", "ticket.transition", "kb.ingest"]
  reviewer:
    purpose: "read a change and say APPROVED or BLOCKED, with file and line"
    base_tools: ["Read", "Grep", "Glob"]
    skills: ["context", "skills", "ask", "impact", "review"]
    may: ["repo.read", "code.index.read", "kb.read", "ticket.read", "pr.read", "ci.read"]
    needs_human: ["ticket.comment", "kb.ingest"]
  architect:
    purpose: "design, the spec gate, impact walk; produce documents, not code"
    base_tools: ["Read", "Grep", "Glob"]
    skills: ["context", "skills", "ask", "impact", "decide", "analyze", "plan", "discover"]
    may: ["repo.read", "code.index.read", "kb.read", "ticket.read", "pr.read", "ci.read"]
    needs_human: ["ticket.comment", "kb.ingest"]
  security:
    purpose: "scan a change for secrets, permission drift and CI tampering"
    base_tools: ["Read", "Grep", "Glob"]
    skills: ["context", "skills", "ask", "impact", "secure"]
    may: ["repo.read", "code.index.read", "kb.read", "ticket.read", "pr.read", "ci.read"]
    needs_human: ["kb.ingest"]

# ── tier B: what the guard hook denies during a run ──────────────────────
# A command string can be rewritten, so this is a real control and not a
# boundary. It catches the ordinary attempt, not a determined one; `reason` is
# what the hand is told, because a denial nobody understands gets worked around.
guard:
  deny_commands:
    - pattern: "git push"
      action: push
      reason: "publishing a branch goes through `sky ship`, which shows you the exact command first"
    - pattern: "git remote add"
      action: push
      reason: "adding a remote is a way to push around the block"
    - pattern: "git remote set-url"
      action: push
      reason: "changing a remote is a way to push around the block"
    - pattern: "git config credential"
      action: push
      reason: "the credential helper is deliberately empty for this run"
    - pattern: "git config --global"
      action: permission.change
      reason: "a run must not change configuration outside its own repository"
    - pattern: "git push --force"
      action: push
      reason: "a force push can destroy work that is not yours"
    - pattern: "git tag"
      action: push
      reason: "a tag is published like a branch and goes the same route"
    - pattern: "gh pr"
      action: pr.open
      reason: "pull requests go through the broker so the intent is recorded"
    - pattern: "gh pr merge"
      action: pr.merge
      reason: "merging is a human decision"
    - pattern: "az repos pr"
      action: pr.open
      reason: "pull requests go through the broker so the intent is recorded"
    - pattern: "glab mr"
      action: pr.open
      reason: "merge requests go through the broker so the intent is recorded"
    - pattern: "curl"
      action: shell.free
      reason: "a shell that can reach the network can do anything this policy forbids; use a named tool"
    - pattern: "wget"
      action: shell.free
      reason: "a shell that can reach the network can do anything this policy forbids; use a named tool"

  # The guard stands aside outside a harness run. Installing this must never
  # make somebody's own agent less capable in an unrelated repository.
  scope: harness_runs_only

  # When the guard cannot load this policy. Inside a managed run it denies
  # every command and says why: the run was promised these rules. Outside a
  # managed run it stands aside, as it does for every command there.
  fails: closed-in-run

# ── writing to the knowledge base ────────────────────────────────────────
ingest:
  # Only this layer is isolated per tenant; the others are shared across
  # tenants on the same host.
  layer: project
  require_stamp: true
  require_redaction_gate: true

# ── ticket naming ────────────────────────────────────────────────────────
# Replaces the prefix that used to be hard-coded in the skills.
tickets:
  # Set this to your own project's prefix at install time. Shipping one real
  # project's prefix as the default would put one team's vocabulary on
  # everybody else's machine.
  prefix: ""
  board_url: ""
