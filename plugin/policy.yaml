# The policy. One file, read by everything that decides.
#
# The launcher reads it before a hand starts (tier 0 and the tool allowlist,
# tier A). The guard hook reads it during a run (tier B). The broker reads it
# before an outward action (H5, H8). They must give the same answer, which is
# why there is one file rather than a list in each of them.
#
# Two rules hold the whole thing up, and `sky policy lint` fails if either is
# broken:
#
#   1. Default deny. An action a role does not list is denied. An action not
#      named in `actions:` at all is denied, not assumed harmless.
#   2. No outward action is ever plainly allowed. Anything that reaches the
#      world outside this machine is `needs_human` or goes through the broker.
#      A role cannot be given `push` by editing this file.

version: 1

workflows:
  feature:
    - id: context
      operation: context
    - id: duplicate-tickets
      operation: duplicate-check
      capability: tickets
      optional: true
    - id: duplicate-prs
      operation: duplicate-check
      capability: prs
      optional: true
    - id: duplicate-kb
      operation: duplicate-check
      capability: kb
      optional: true
    - id: architect
      agent: architect
      gate: true
    - id: developer
      agent: developer
    - id: reviewer
      agent: reviewer
      gate: true
    - id: security
      agent: security
      gate: true
    - id: ship
      operation: ship

routing:
  feature:
    contains: ["implement", "feature"]
    workflow: feature
  review:
    contains: ["review"]
    agent: reviewer
  design:
    contains: ["design"]
    agent: architect
  security:
    contains: ["security audit"]
    agent: security

# ── what the words mean ──────────────────────────────────────────────────
# Every action a role can request, and whether it leaves this machine.
# `outward: true` means it changes something other people can see.
actions:
  repo.read:
    outward: false
    description: "read files in the repository under work"
  repo.edit:
    outward: false
    description: "create or change files inside the repository"
  repo.edit_outside:
    outward: false
    description: "create or change files outside the repository"
    never: "a hand works in one repository; writing outside it is how a run touches something nobody reviewed"
  test.run:
    outward: false
    description: "run the repository's own test command"
  commit.local:
    outward: false
    description: "commit to a local branch; nothing leaves the machine"
  code.index.read:
    outward: false
    description: "query the indexed copy of the code in the knowledge base"
  kb.read:
    outward: false
    description: "search the knowledge base"
  ticket.read:
    outward: false
    description: "read a ticket and its status"
  pr.read:
    outward: false
    description: "read a pull request and its comments"
  ci.read:
    outward: false
    description: "read pipeline results"
  shell.free:
    outward: false
    description: "run an arbitrary shell command"
    never: "an allowlist of commands is a boundary; a free shell is the absence of one"

  push:
    outward: true
    broker: push_branch
    description: "publish a branch"
  pr.open:
    outward: true
    broker: open_pr
    description: "open a pull request"
  pr.vote:
    outward: true
    description: "approve or reject a pull request"
    never: "an agent voting on a pull request is an agent reviewing its own work, or standing in for someone who should have looked"
  pr.merge:
    outward: true
    description: "merge a pull request"
    never: "the last human checkpoint before code is live"
  ticket.comment:
    outward: true
    broker: comment
    description: "comment on a ticket, from a fixed template"
  ticket.transition:
    outward: true
    broker: transition
    description: "move a ticket to another status"
  ticket.assign:
    outward: true
    description: "change who a ticket is assigned to"
    never: "the assignee is the human answerable for the work and never changes because an agent ran"
  pipeline.run:
    outward: true
    description: "start a CI pipeline"
    never: "a pipeline holds deployment credentials this policy cannot see"
  kb.ingest:
    outward: true
    description: "write to the knowledge base"
  deploy:
    outward: true
    description: "release to any environment"
    never: "not an operation the harness has"
  permission.change:
    outward: true
    description: "change this policy, a grant, or an agent card"
    never: "an agent that can widen its own permission has none"
  skill.promote:
    outward: true
    description: "activate a skill or raise its grant"
    never: "skills are granted by a reviewed change, never by the agent using them"

# ── tool groups ──────────────────────────────────────────────────────────
# The knowledge and code tools, named once. Three roles have identical read
# access to both, and writing that out three times is three chances for them to
# drift apart.
#
# A tool's id is `mcp__<server>__<tool>`. Every launch path this project ships
# — `sky build`, and `sky setup init`'s registration — names the remote servers
# `kb` and `code`; the project-local adapter uses `sky_kb`. (The plugin ships no MCP
# configuration of its own; an earlier second spelling for one was removed as
# a promise with nothing behind it, SH-010.)
#
# Every name here is checked against the live servers by
# `scripts/check-allowlists.py`.
tool_groups:
  # The shared skill catalogue (D-20): READS only, and no `jobs_*` — a role
  # never ingests into it, so it never needs to watch an ingest job there.
  # Publishing to the catalogue is a reviewed change run by a person, not an
  # action any agent has (D-18).
  kb_read:
    - mcp__kb__kb_search
    - mcp__kb__kb_similarity_search
    - mcp__kb__kb_agentic_search
    - mcp__kb__kb_graph_query
    - mcp__kb__kb_context_search
    - mcp__kb__kb_layer_search
    - mcp__kb__kb_ontologies_list
    - mcp__kb__kb_ontologies_get
    - mcp__kb__kb_jobs_status
    - mcp__kb__kb_jobs_output
    - mcp__sky_kb__search
    - mcp__sky_kb__neighbours
    - mcp__sky_kb__decisions_find
  code_read:
    - mcp__code__find_symbols
    - mcp__code__outline_file
    - mcp__code__read_source
    - mcp__code__related_symbols
    - mcp__code__search_definitions
    - mcp__code__get_definition
    - mcp__code__get_source
    - mcp__code__view_signatures
    - mcp__code__inspect_symbol
    - mcp__code__get_dependencies
    - mcp__code__find_related_code
    - mcp__code__summarize_impact
    - mcp__code__coverage_by_path
    - mcp__code__list_files
    - mcp__code__list_indexed_repos
    - mcp__code__get_repo_status
    - mcp__code__repo_health_report

  catalogue_read:
    - mcp__catalogue__kb_search
    - mcp__catalogue__kb_similarity_search
    - mcp__catalogue__kb_agentic_search
    - mcp__catalogue__kb_graph_query
    - mcp__catalogue__kb_context_search
    - mcp__catalogue__kb_ontologies_list
    - mcp__catalogue__kb_ontologies_get

# ── the four roles ───────────────────────────────────────────────────────
# `tools` is the host-enforced allowlist — tier A, the strongest in-session
# control. `may` is what the role can do at all. `needs_human` is what it may
# prepare and not perform.
tools:
  Read: "repo.read"
  Grep: "repo.read"
  Glob: "repo.read"
  Edit: "repo.edit"
  Write: "repo.edit"
  "Bash(git add:*)": "commit.local"
  "Bash(git commit:*)": "commit.local"
  "Bash(git status:*)": "repo.read"
  "Bash(git diff:*)": "repo.read"
  "Bash(git log:*)": "repo.read"
  "Bash(npm test:*)": "test.run"
  "Bash(pytest:*)": "test.run"
  "Bash(make test:*)": "test.run"
  # Local writes belong to the runtime; ingest and decisions_record are unbound.
  mcp__sky_kb__search:
    action: "kb.read"
    reviewed_by: "@arupmmi07"
  mcp__sky_kb__neighbours:
    action: "kb.read"
    reviewed_by: "@arupmmi07"
  mcp__sky_kb__decisions_find:
